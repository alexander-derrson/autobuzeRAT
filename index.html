<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RAT Craiova Tracker</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>RAT Craiova Tracker</h1>

    <div class="controls">

      <label>
        Route:
        <select id="routeFilter">
          <option value="all">All routes</option>
        </select>
      </label>

      <button id="refreshButton">
        Refresh
      </button>

    </div>

    <div class="stop-search">
      <input
        id="stopSearch"
        type="search"
        placeholder="Search a bus stop (e.g. Complex Nou 25)"
        autocomplete="off"
      >
      <ul id="stopResults" class="stop-results" hidden></ul>
    </div>

    <div id="status">
      Loading...
    </div>
  </header>

  <main>

    <div id="map"></div>

    <div id="vehicleMenu" class="vehicle-menu">

      <div class="vehicle-menu-header">
        <h3>Vehicles</h3>
      </div>

      <div class="vehicle-tabs" role="tablist">
        <button type="button" class="vehicle-tab selected" data-view="active" role="tab" aria-selected="true">
          Active vehicles <span class="vehicle-tab-count" id="tabCountActive"></span>
        </button>
        <button type="button" class="vehicle-tab" data-view="all" role="tab" aria-selected="false">
          All vehicles <span class="vehicle-tab-count" id="tabCountAll"></span>
        </button>
      </div>

      <div id="vehicleList">
        Loading vehicles...
      </div>

    </div>

  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script src="app.js"></script>

</body>
</html>
